<div class="container-xl">
  <div class="table-responsive">
    <div class="table-wrapper">
      <div class="table-title">
        <div class="row">
          <div class="col-sm-6">
            <h4><b>New Employee</b></h4>
          </div>
          <div class="col-sm-6">
            <a href="#" routerLink="/Home" class="btn btn-success back"
              ><i class="fas fa-arrow-circle-left"></i> &nbsp;Back</a
            >
          </div>
        </div>
      </div>
      <form #employeeForm="ngForm">
        <div class="table-content">
          <div class="form-group p-10 row">
            <div class="col-sm-3">
              <label for="firstName" class="p-t-b-10"
                >First Name<span class="requiredStar">*</span></label
              >
            </div>
            <div class="col-sm-9">
              <input
                type="text"
                class="form-control"
                id="firstName"
                required
                maxlength="255"
                [(ngModel)]="addEmployeeForm.firstName"
                name="firstName"
                #firstName="ngModel"
                (keypress)="validateTextOnly($event)"
              />
              <div
                *ngIf="firstName.errors && isSubmitted"
                class="alert alert-danger validationError"
              >
                <div [hidden]="!firstName.errors?.['required']">
                  First Name is required
                </div>
              </div>
            </div>
          </div>
          <div class="form-group p-10 row">
            <div class="col-sm-3">
              <label for="lastName" class="p-t-b-10"
                >Last Name<span class="requiredStar">*</span></label
              >
            </div>
            <div class="col-sm-9">
              <input
                type="text"
                class="form-control"
                id="lastName"
                required
                maxlength="255"
                [(ngModel)]="addEmployeeForm.lastName"
                name="lastName"
                #lastName="ngModel"
                (keypress)="validateTextOnly($event)"
              />
              <div
                *ngIf="lastName.errors && isSubmitted"
                class="alert alert-danger validationError"
              >
                <div [hidden]="!lastName.errors?.['required']">
                  Last Name is required
                </div>
              </div>
            </div>
          </div>
          <div class="form-group p-10 row">
            <div class="col-sm-3">
              <label class="p-t-b-10"
                >email<span class="requiredStar">*</span></label
              >
            </div>
            <div class="col-sm-9">
              <input
                type="email"
                class="form-control"
                id="email"
                required
                maxlength="255"
                [(ngModel)]="addEmployeeForm.email"
                name="email"
                #email="ngModel"
                pattern="^[a-zA-Z0-9._-]+@[a-zA-Z0-9.-]+\.[a-zA-Z0-9]{2,3}$"
              />
              <div
                *ngIf="email.errors && isSubmitted"
                class="alert alert-danger validationError"
              >
                <div [hidden]="!email.errors?.['required']">
                  email is required
                </div>
                <div
                  [hidden]="!email.errors?.['touched'] && !email.errors?.['pattern']"
                >
                  email is invalid
                </div>
              </div>
            </div>
          </div>
          <div class="form-group p-10 row">
            <div class="col-sm-3">
              <label class="p-t-b-10"
                >address<span class="requiredStar">*</span></label
              >
            </div>
            <div class="col-sm-9">
              <textarea
                class="form-control"
                id="address"
                required
                [(ngModel)]="addEmployeeForm.address"
                name="address"
                #address="ngModel"
              >
></textarea
              >
              <div
                *ngIf="address.errors && isSubmitted"
                class="alert alert-danger validationError"
              >
                <div [hidden]="!address.errors?.['required']">
                  address is required
                </div>
              </div>
            </div>
          </div>
          <div class="form-group p-10 row">
            <div class="col-sm-3">
              <label class="p-t-b-10"
                >phone<span class="requiredStar">*</span></label
              >
            </div>
            <div class="col-sm-9">
              <input
                type="number"
                class="form-control"
                id="phone"
                required
                maxlength="10"
                [(ngModel)]="addEmployeeForm.phone"
                name="phone"
                #phone="ngModel"
                pattern="^\d{3}\d{3}\d{4}$"
              />
              <div
                *ngIf="phone.errors && isSubmitted"
                class="alert alert-danger validationError"
              >
                <div [hidden]="!phone.errors?.['required']">
                  phone is required
                </div>
                <div
                  [hidden]="!phone.errors?.['touched'] && !phone.errors?.['pattern']"
                >
                  phone is invalid
                </div>
              </div>
            </div>
          </div>
          <div class="form-group p-10 row">
            <div class="col-sm-3">
              <label class="p-t-b-10">New Employee</label>
            </div>
            <div class="col-sm-9">
              <input
                type="checkbox"
                class="form-check-input"
                id="newEmployee"
                [(ngModel)]="addEmployeeForm.newEmployee"
                name="newEmployee"
                #newEmployee="ngModel"
              />
            </div>
          </div>
          <div class="form-group p-10 row">
            <div class="col-sm-3">
              <label class="p-t-b-10"
                >birthday<span class="requiredStar">*</span></label
              >
            </div>
            <div class="col-sm-9">
              <input
                type="date"
                class="form-control form-control-sm"
                id="birthday"
                required
                [(ngModel)]="addEmployeeForm.birthday"
                name="birthday"
                #birthday="ngModel"
                (change)="validateAge()"
                max="{{ maxDate }}"
              />

              <div
                *ngIf="(birthday.errors || isUnderage) && isSubmitted"
                class="alert alert-danger validationError"
              >
                <div [hidden]="!birthday.errors?.['required']">
                  Birth Date is required
                </div>
                <div [hidden]="!isUnderage">
                  You must be at least 18 years old
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="table-footer">
          <button
            class="btn btn-success"
            (click)="AddEmployee(employeeForm.form.valid)"
          >
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
